<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Lần Hạt Mân Côi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="description" content="Ứng dụng hỗ trợ cầu nguyện Mân Côi theo truyền thống Công Giáo">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes bounce{0%,100%{transform:translateY(-25%)}50%{transform:translateY(0)}}
        @keyframes fadeSlideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
        @keyframes buttonPress{0%{transform:scale(1)}50%{transform:scale(0.95)}100%{transform:scale(1)}}
        @keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
        .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
        .animate-bounce{animation:bounce 1s infinite}
        .fade-slide{animation:fadeSlideIn 0.4s ease-out}
        .button-press{animation:buttonPress 0.3s ease-out}
        .text-size-small{font-size:13pt;line-height:1.5}
        .text-size-medium{font-size:14pt;line-height:1.6}
        .text-size-large{font-size:18pt;line-height:1.7}
        .prayer-container{height:450px;display:flex;flex-direction:column}
        .prayer-content-scroll{flex:1;overflow-y:auto;margin-bottom:16px;padding-right:4px}
        .prayer-content-scroll::-webkit-scrollbar{width:6px}
        .prayer-content-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,0.1);border-radius:3px}
        .prayer-content-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:3px}
        .prayer-content-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.5)}
        .prayer-text{max-height:none}
        .btn-action{position:relative;overflow:hidden;transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1)}
        .btn-action:active{transform:scale(0.95)}
        .btn-action:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,0.2)}
        .ripple-effect{position:absolute;border-radius:50%;background:rgba(255,255,255,0.5);pointer-events:none;animation:ripple 0.6s ease-out}
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="prayers.js"></script>
    
    <script type="text/babel">
        const {useState,useEffect,useRef}=React;
        
        const mysteriesData = {
            vi: {
                'Mầu Nhiệm Vui':{days:'Thứ 2, Thứ 7',color:'from-yellow-400 to-orange-500',items:['Thiên thần truyền tin cho Đức Bà chịu thai. Ta hãy xin cho được ở khiêm nhường.','Đức Bà đi viếng Bà Thánh Isave. Ta hãy xin cho được lòng yêu người.','Đức Bà sinh Đức Chúa Giêsu trong hang đá. Ta hãy xin cho được lòng khó khăn.','Đức Bà dâng Đức Chúa Giêsu trong đền Thánh. Ta hãy xin cho được vâng lời chịu lụy.','Đức Bà tìm được Đức Chúa Giêsu trong Đền thánh. Ta hãy xin cho được giữ nghĩa cùng Chúa luôn.']},
                'Mầu Nhiệm Thương':{days:'Thứ 3, Thứ 6',color:'from-red-400 to-rose-500',items:['Đức Chúa Giêsu lo buồn đổ mổ hôi máu. Ta hãy xin cho được ăn năn tội nên.','Đức Chúa Giêsu chịu đánh đòn. Ta hãy xin cho được hãm mình chịu khó bằng lòng.','Đức Chúa Giêsu chịu đội mão gai. Ta hãy xin cho được chịu mọi sự sỉ nhục bằng lòng.','Đức Chúa Giêsu vác Thánh Giá. Ta hãy xin cho được vác Thánh Giá theo chân Chúa.','Đức Chúa Giêsu chịu chết trên cây Thánh Giá. Ta hãy xin đóng đanh tính xác thịt vào Thánh Giá Chúa.']},
                'Mầu Nhiệm Mừng':{days:'Thứ 4, Chủ Nhật',color:'from-amber-400 to-yellow-500',items:['Đức Chúa Giêsu sống lại. Ta hãy xin cho được sống lại thật về phần linh hồn.','Đức Chúa Giêsu lên trời. Ta hãy xin cho được ái mộ những sự trên trời.','Đức Chúa Thánh Thần hiện xuống. Ta hãy xin cho được lòng đầy dẫy mọi ơn Đức Chúa Thánh Thần.','Đức Chúa Trời cho Đức Bà lên trời. Ta hãy xin ơn chết lành trong tay Đức Mẹ.','Đức Chúa Trời thưởng Đức Mẹ trên trời. Ta hãy xin Đức Mẹ phù hộ cho ta được thưởng cùng Đức Mẹ trên nước thiên đàng.']},
                'Mầu Nhiệm Sáng':{days:'Thứ 5',color:'from-blue-400 to-cyan-500',items:['Đức Chúa Giêsu chịu phép Rửa tại sông Giodan. Ta hãy xin cho được sống xứng đáng là con cái Chúa.','Đức Chúa Giêsu dự tiệc cưới Cana. Ta hãy xin cho được vững tin vào quyền năng của Ngài.','Đức Chúa Giêsu rao giảng Nước Trời. Ta hãy xin cho được hoán cải và đón nhận Tin Mừng.','Đức Chúa Giêsu biến hình trên núi. Ta hãy xin cho được lắng nghe và thực hành lời Chúa.','Đức Chúa Giêsu lập bí tích Thánh Thể. Ta hãy xin cho được năng kết hiệp cùng Chúa Giêsu Thánh Thể.']}
            },
            en: {
                'Joyful Mysteries':{days:'Mon, Sat',color:'from-yellow-400 to-orange-500',items:['The Annunciation. Let us ask for humility.','The Visitation. Let us ask for charity toward our neighbor.','The Nativity. Let us ask for the spirit of poverty.','The Presentation. Let us ask for obedience.','Finding Jesus in the Temple. Let us ask for the grace of fidelity to God.']},
                'Sorrowful Mysteries':{days:'Tue, Fri',color:'from-red-400 to-rose-500',items:['The Agony in the Garden. Let us ask for contrition for our sins.','The Scourging at the Pillar. Let us ask for the spirit of mortification.','The Crowning with Thorns. Let us ask for moral courage.','The Carrying of the Cross. Let us ask for patience in trials.','The Crucifixion. Let us ask for final perseverance.']},
                'Glorious Mysteries':{days:'Wed, Sun',color:'from-amber-400 to-yellow-500',items:['The Resurrection. Let us ask for faith.','The Ascension. Let us ask for hope and desire for heaven.','The Descent of the Holy Spirit. Let us ask for the gifts of the Holy Spirit.','The Assumption. Let us ask for a happy death.','The Coronation of Mary. Let us ask for the grace of eternal salvation.']},
                'Luminous Mysteries':{days:'Thu',color:'from-blue-400 to-cyan-500',items:['The Baptism of Jesus. Let us ask to live as children of God.','The Wedding at Cana. Let us ask for faith in God\'s power.','The Proclamation of the Kingdom. Let us ask for conversion and acceptance of the Gospel.','The Transfiguration. Let us ask to listen and follow Christ.','The Institution of the Eucharist. Let us ask for union with Jesus in the Eucharist.']}
            }
        };
        
        const uiTexts = {
            vi: {
                title:'Lần Hạt Mân Côi', total:'Tổng cộng', days:'ngày', next:'Tiếp Theo', prev:'Quay Lại',
                complete:'Hoàn Thành', completed:'Hoàn Thành Chuỗi Mân Côi!', reset:'Reset', prayers:'Kinh',
                share:'Chia sẻ', selectMystery:'Chọn Mầu Nhiệm:', view5Mysteries:'Xem 5 Sự',
                history:'Lịch Sử:', quote:'"Lạy Mẹ Maria, xin cầu cho chúng con"', prayersTitle:'Các Kinh Nguyện',
                decade:'Thập', copied:'Đã sao chép!', mysteryPrefix:'Mầu Nhiệm Thứ',
                signCross:'Làm Dấu Thánh Giá và đọc', read:'Đọc', and:'và'
            },
            en: {
                title:'Holy Rosary', total:'Total', days:'days', next:'Next', prev:'Back',
                complete:'Complete', completed:'Rosary Completed!', reset:'Reset', prayers:'Prayers',
                share:'Share', selectMystery:'Select Mystery:', view5Mysteries:'View 5 Mysteries',
                history:'History:', quote:'"Holy Mary, Mother of God, pray for us"', prayersTitle:'Prayers',
                decade:'Decade', copied:'Copied!', mysteryPrefix:'Mystery',
                signCross:'Sign of the Cross and', read:'Pray', and:'and'
            }
        };

        const translations = {
            vi: { mysteries: mysteriesData.vi, prayers: prayersData.vi, ui: uiTexts.vi },
            en: { mysteries: mysteriesData.en, prayers: prayersData.en, ui: uiTexts.en }
        };

        // ✅ HÀM TỰ ĐỘNG CHỌN MẦU NHIỆM THEO NGÀY
        function getDefaultMystery(language='vi'){
            const day=new Date().getDay(); // 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7
            const mysteryByDay={
                vi:{0:'Mầu Nhiệm Mừng',1:'Mầu Nhiệm Vui',2:'Mầu Nhiệm Thương',3:'Mầu Nhiệm Mừng',4:'Mầu Nhiệm Sáng',5:'Mầu Nhiệm Thương',6:'Mầu Nhiệm Vui'},
                en:{0:'Glorious Mysteries',1:'Joyful Mysteries',2:'Sorrowful Mysteries',3:'Glorious Mysteries',4:'Luminous Mysteries',5:'Sorrowful Mysteries',6:'Joyful Mysteries'}
            };
            return mysteryByDay[language][day];
        }

        function App(){
            // ✅ SỬA LỖI 1: Bỏ khoảng trắng trong tên biến 'showCredit,setShowCredit'
            // ✅ SỬA LỖI 2: Bỏ khoảng trắng trong tên biến 'fontSize,setFontSize'
            // ✅ SỬA LỖI 3: Bỏ khoảng trắng đầu trong giá trị 'Mầu Nhiệm Vui'
            // ✅ SỬA LỖI 4: Thêm tự động chọn mầu nhiệm theo ngày
            const [s,setS]=useState(0),[bc,setBc]=useState(0),[dec,setDec]=useState(0),[mys,setMys]=useState(getDefaultMystery('vi')),
                  [showP,setShowP]=useState(false),[showM,setShowM]=useState(false),[showCredit,setShowCredit]=useState(false),
                  [hist,setHist]=useState([]),[dark,setDark]=useState(true),[share,setShare]=useState(false),
                  [total,setTotal]=useState(0),[streak,setStreak]=useState(0),[lang,setLang]=useState('vi'),[fontSize,setFontSize]=useState('medium');
            const nextBtnRef=useRef(null), prevBtnRef=useRef(null);
           
            useEffect(()=>{
                try{
                    const saved=localStorage.getItem('rosaryData');
                    if(saved){
                        const d=JSON.parse(saved);
                        setHist(d.history||[]);
                        setTotal(d.totalPrayers||0);
                        setStreak(d.streak||0);
                        const savedLang=d.language||'vi';
                        setLang(savedLang);
                        setFontSize(d.fontSize||'medium');
                        // ✅ Tự động cập nhật mầu nhiệm theo ngày hiện tại
                        const todayMystery=getDefaultMystery(savedLang);
                        setMys(todayMystery);
                    }
                }catch(e){console.error('Error loading data:',e);}
            },[]);

            const t=translations[lang], M=t.mysteries, P=t.prayers;
            const mysteryKeys={'Mầu Nhiệm Vui':'Joyful Mysteries','Mầu Nhiệm Thương':'Sorrowful Mysteries','Mầu Nhiệm Mừng':'Glorious Mysteries','Mầu Nhiệm Sáng':'Luminous Mysteries','Joyful Mysteries':'Mầu Nhiệm Vui','Sorrowful Mysteries':'Mầu Nhiệm Thương','Glorious Mysteries':'Mầu Nhiệm Mừng','Luminous Mysteries':'Mầu Nhiệm Sáng'};
            const currentMysKey=lang==='vi'?mys:mysteryKeys[mys]||'Joyful Mysteries';
            
            const steps=[
                {i:lang==='vi'?t.ui.signCross+' '+t.prayers['Kinh Tin Kính'].split('.')[0]:t.ui.signCross+' '+Object.keys(t.prayers)[0],p:Object.keys(t.prayers)[0],c:1,e:'✝️'},
                {i:t.ui.read+' '+Object.keys(t.prayers)[1],p:Object.keys(t.prayers)[1],c:1,e:'🙏'},
                {i:t.ui.read+' 3 '+Object.keys(t.prayers)[2],p:Object.keys(t.prayers)[2],c:3,e:'📿'},
                {i:t.ui.read+' '+Object.keys(t.prayers)[3],p:Object.keys(t.prayers)[3],c:1,e:'✨'}
            ];
            
            const getStep=()=>{
                if(s<4)return steps[s];
                if(s>=24)return s===24?{i:t.ui.read+' '+Object.keys(t.prayers)[4],p:Object.keys(t.prayers)[4],c:1,e:'👑'}:{i:lang==='vi'?'Làm Dấu Thánh Giá - Hoàn Thành!':'Sign of the Cross - Complete!',p:'',c:0,e:'✝️'};
                const dIdx=Math.floor((s-4)/4),sInD=(s-4)%4;
                const dSteps=[
                    {i:(lang==='vi'?t.ui.mysteryPrefix:t.ui.mysteryPrefix)+' '+(dIdx+1)+': '+M[currentMysKey].items[dIdx],p:'mystery',c:0,e:'🌟'},
                    {i:t.ui.read+' '+Object.keys(t.prayers)[1],p:Object.keys(t.prayers)[1],c:1,e:'🙏'},
                    {i:t.ui.read+' 10 '+Object.keys(t.prayers)[2],p:Object.keys(t.prayers)[2],c:10,e:'📿'},
                    {i:t.ui.read+' '+Object.keys(t.prayers)[3]+' '+t.ui.and+' '+Object.keys(t.prayers)[5],p:Object.keys(t.prayers)[3],c:1,e:'✨'}
                ];
                return dSteps[sInD];
            };

            const createRipple=(e,btnRef)=>{
                const button=btnRef.current;
                if(!button)return;
                const rect=button.getBoundingClientRect();
                const ripple=document.createElement('span');
                const size=Math.max(rect.width,rect.height);
                const x=e.clientX-rect.left-size/2;
                const y=e.clientY-rect.top-size/2;
                ripple.style.width=ripple.style.height=`${size}px`;
                ripple.style.left=`${x}px`;
                ripple.style.top=`${y}px`;
                ripple.classList.add('ripple-effect');
                button.appendChild(ripple);
                setTimeout(()=>ripple.remove(),600);
            };
            
            const next=(e)=>{
                createRipple(e,nextBtnRef);
                const cur=getStep();
                if(cur.c===0||bc+1>=cur.c){
                    if(s<25){
                        setS(s+1);setBc(0);
                        if(s>=4&&s<24&&(s-4)%4===3)setDec(Math.floor((s-4)/4)+1);
                    }else{
                        try{
                            const sess={mystery:currentMysKey,date:new Date().toLocaleString(lang==='vi'?'vi-VN':'en-US'),completed:true};
                            const newH=[sess,...hist.slice(0,9)],newT=total+1,newS=streak+1;
                            setHist(newH);setTotal(newT);setStreak(newS);
                            localStorage.setItem('rosaryData',JSON.stringify({history:newH,totalPrayers:newT,streak:newS,language:lang,fontSize:fontSize}));
                        }catch(e){console.error('Error saving data:',e);}
                        setS(0);setBc(0);setDec(0);
                    }
                }else{setBc(bc+1);}
            };

            const prev=(e)=>{
                createRipple(e,prevBtnRef);
                if(bc>0){setBc(bc-1);}
                else if(s>0){
                    setS(s-1);
                    const prevStep=s===1?steps[0]:s<=4?steps[s-1]:s===4?steps[3]:(()=>{
                        const dIdx=Math.floor((s-5)/4),sInD=(s-5)%4;
                        return [{c:0},{c:1},{c:10},{c:1}][sInD<0?3:sInD];
                    })();
                    setBc(prevStep.c>0?prevStep.c-1:0);
                    if(s>=5&&s<=24&&(s-5)%4===0)setDec(Math.floor((s-5)/4));
                }
            };
            
            const shareText=()=>{
                const txt=lang==='vi'?`🙏 Tôi vừa lần Mân Côi (${currentMysKey})!\n\n📊 Tổng: ${total} lần\n🔥 Chuỗi: ${streak} ngày\n\n#MânCôi`:`🙏 I just prayed the Rosary (${currentMysKey})!\n\n📊 Total: ${total} times\n🔥 Streak: ${streak} days\n\n#Rosary`;
                if(navigator.share)navigator.share({title:lang==='vi'?'Mân Côi':'Holy Rosary',text:txt});
                else{navigator.clipboard.writeText(txt);setShare(true);setTimeout(()=>setShare(false),2000);}
            };
            
            const toggleLang=()=>{
                const newLang=lang==='vi'?'en':'vi';
                setLang(newLang);
                // ✅ Chuyển đổi mầu nhiệm sang ngôn ngữ tương ứng
                const newMystery=mysteryKeys[mys]||getDefaultMystery(newLang);
                setMys(newMystery);
                try{
                    const saved=localStorage.getItem('rosaryData');
                    if(saved){const d=JSON.parse(saved);d.language=newLang;localStorage.setItem('rosaryData',JSON.stringify(d));}
                }catch(e){console.error('Error saving language:',e);}
            };
            
            const toggleFontSize=()=>{
                const sizes=['small','medium','large'];
                const idx=sizes.indexOf(fontSize);
                const newSize=sizes[(idx+1)%3];
                setFontSize(newSize);
                try{
                    const saved=localStorage.getItem('rosaryData');
                    if(saved){const d=JSON.parse(saved);d.fontSize=newSize;localStorage.setItem('rosaryData',JSON.stringify(d));}
                }catch(e){console.error('Error saving font size:',e);}
            };
            
            // ✅ HÀM TỰ ĐỘNG CHỌN MẦU NHIỆM HÔM NAY
            const setTodayMystery=()=>{
                const todayMystery=getDefaultMystery(lang);
                setMys(todayMystery);
            };
            
            // ✅ LẤY TÊN NGÀY HIỆN TẠI
            const getDayName=()=>{
                const days={vi:['Chủ Nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'],en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']};
                return days[lang][new Date().getDay()];
            };
            
            const cur=getStep(),cm=M[currentMysKey],prog=(s/25)*100;
            const bg=dark?'bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900':'bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100';
            const card=dark?'bg-white/10 border-white/20':'bg-white/80 border-gray-200';
            const txt=dark?'text-white':'text-gray-900',txt2=dark?'text-blue-200':'text-gray-600';

            return React.createElement('div',{className:`min-h-screen ${bg} flex items-center justify-center p-4 transition-colors duration-500`},
                React.createElement('div',{className:'w-full max-w-md'},
                    React.createElement('div',{className:`${card} backdrop-blur-lg rounded-3xl shadow-2xl p-8 border transition-colors duration-500`},
                        React.createElement('div',{className:'flex justify-between items-start mb-6'},
                            React.createElement('div',{className:'flex gap-2'},
                                React.createElement('button',{onClick:()=>setDark(!dark),className:`${dark?'bg-white/10':'bg-gray-200'} hover:opacity-80 ${txt} p-2 rounded-lg border ${dark?'border-white/20':'border-gray-300'} transition-all`},dark?'🌙':'☀️'),
                                React.createElement('button',{onClick:toggleLang,className:`${dark?'bg-white/10':'bg-gray-200'} hover:opacity-80 ${txt} px-3 py-2 rounded-lg border ${dark?'border-white/20':'border-gray-300'} text-sm font-semibold transition-all`},lang==='vi'?'EN':'VI'),
                                React.createElement('button',{onClick:toggleFontSize,className:`${dark?'bg-white/10':'bg-gray-200'} hover:opacity-80 ${txt} px-3 py-2 rounded-lg border ${dark?'border-white/20':'border-gray-300'} text-sm font-semibold transition-all`},fontSize==='small'?'A-':fontSize==='large'?'A+':'Aa')
                            ),
                            React.createElement('div',{className:'text-right'},
                                React.createElement('div',{className:`text-xs ${txt2}`},t.ui.total),
                                React.createElement('div',{className:`text-lg font-bold ${txt}`},total),
                                React.createElement('div',{className:`text-xs ${txt2}`},`🔥 ${streak} ${t.ui.days}`)
                            )
                        ),
                        React.createElement('div',{className:'text-center mb-6'},
                            React.createElement('div',{className:`inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br ${cm.color} rounded-full mb-4 shadow-lg ${s>0?'animate-pulse':''}`},'❤️'),
                            React.createElement('h1',{className:`text-3xl font-bold ${txt} mb-2`},t.ui.title),
                            React.createElement('p',{className:txt2+' text-sm font-medium'},currentMysKey),
                            React.createElement('p',{className:`${dark?'text-blue-300/60':'text-gray-500'} text-xs`},cm.days)
                        ),
                        React.createElement('div',{className:`${dark?'bg-white/5':'bg-gray-200'} rounded-full h-2 mb-6`},
                            React.createElement('div',{className:`bg-gradient-to-r ${cm.color} h-2 rounded-full transition-all duration-300`,style:{width:`${prog}%`}})
                        ),
                        React.createElement('div',{className:`${dark?'bg-white/5':'bg-gray-50'} rounded-2xl p-6 mb-6 border ${dark?'border-white/10':'border-gray-200'} prayer-container`},
                            React.createElement('div',{key:s,className:'prayer-content-scroll fade-slide'},
                                React.createElement('div',{className:'text-center mb-4'},
                                    cur.e==='🌟'&&React.createElement('div',{className:'text-6xl mb-2'},cur.e),
                                    React.createElement('div',{className:`${txt} text-lg font-semibold mb-2`},cur.i),
                                    cur.c>1&&React.createElement('div',{className:`${txt2} text-3xl font-bold mb-3`},`${bc+1} / ${cur.c}`),
                                    s===25&&React.createElement('div',{className:'text-yellow-400 font-bold text-xl animate-bounce mt-2'},`✨ ${t.ui.completed} ✨`)
                                ),
                                cur.p&&cur.p!=='mystery'&&React.createElement('div',{className:`${dark?'bg-white/5 border-white/10':'bg-white border-gray-200'} rounded-xl p-4 border`},
                                    React.createElement('p',{className:`${dark?'text-white/80':'text-gray-700'} leading-relaxed text-center prayer-text text-size-`+fontSize,style:{whiteSpace:'pre-line'}},
